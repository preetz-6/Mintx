<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mintx Test — Shipping Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .form-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 480px;
      max-width: 95vw;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a2e;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-row .form-group {
      flex: 1;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button[type="submit"]:hover {
      background: #5a4bd1;
    }
    .success-msg {
      display: none;
      padding: 16px;
      background: #d4edda;
      border-radius: 8px;
      color: #155724;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Shipping Information</h1>
    <p class="subtitle">Enter your details to complete the order</p>

    <form id="shipping-form">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName" placeholder="Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="rahul@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" required>
      </div>

      <div class="form-group">
        <label for="address">Street Address</label>
        <input type="text" id="address" name="address" placeholder="123 Main Street, Sector 5" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="Bangalore" required>
        </div>
        <div class="form-group">
          <label for="pincode">PIN Code</label>
          <input type="text" id="pincode" name="pincode" placeholder="560001" required>
        </div>
      </div>

      <div class="form-group">
        <label for="state">State</label>
        <select id="state" name="state" required>
          <option value="">Select state</option>
          <option value="KA">Karnataka</option>
          <option value="MH">Maharashtra</option>
          <option value="DL">Delhi</option>
          <option value="TN">Tamil Nadu</option>
          <option value="UP">Uttar Pradesh</option>
          <option value="WB">West Bengal</option>
          <option value="GJ">Gujarat</option>
        </select>
      </div>

      <button type="submit">Continue to Payment</button>
    </form>

    <div class="success-msg" id="success-msg">
      ✅ Shipping information saved! Redirecting to payment...
    </div>
  </div>

  <script>
    document.getElementById('shipping-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('shipping-form').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    });
  </script>
</body>
</html>
